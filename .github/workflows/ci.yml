name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint & Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the runtime images; 3.12 guards forward compatibility.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest with coverage gate
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Test results (py${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  docker-image:
    name: Build, Scan & Smoke-Test Images
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          tags: kpi-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          tags: kpi-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Image scans surface OS/library CVEs (exit-code 0 = report, don't block):
      # base-image CVEs are outside our code's control and are remediated by the
      # Dependabot docker updates. Flip exit-code to "1" to harden into a gate.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kpi-backend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kpi-frontend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d

      - name: Smoke-test the running stack
        run: |
          echo "Waiting for the backend to become healthy..."
          curl --retry 20 --retry-delay 3 --retry-all-errors --fail -s http://localhost:8000/health
          echo "Backend healthy. Checking endpoints..."
          curl --fail -s http://localhost:8000/ | grep -q "running"
          curl --fail -s http://localhost:8000/kpis | grep -q "total_devices"
          DEVICES=$(curl --fail -s http://localhost:8000/ready | python3 -c "import sys,json; print(json.load(sys.stdin)['devices_loaded'])")
          echo "Devices loaded: $DEVICES"
          test "$DEVICES" -ge 10
          echo "Waiting for the frontend..."
          curl --retry 20 --retry-delay 3 --retry-all-errors --fail -s http://localhost:8501/_stcore/health
          echo "Frontend healthy. Smoke test passed."

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  security:
    name: Repository Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Report-only (exit-code 0): a single upstream advisory on a pinned dep
      # shouldn't turn the build red; Dependabot drives remediation instead.
      - name: Trivy filesystem scan (dependencies & secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy config scan (Dockerfile & compose misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
