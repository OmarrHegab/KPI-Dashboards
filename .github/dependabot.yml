version: 2
updates:
  # Keep GitHub Actions pinned versions current (pairs with SHA-pinning).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Keep pinned Python dependencies current.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep base Docker images current.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
